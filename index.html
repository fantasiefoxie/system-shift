<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>System Shift – Research Build</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
    <canvas id="ambientCanvas"></canvas>
    <div id="systemWarningOverlay"></div>

    <!-- TOP ROW -->
    <div class="top-bar">
        <div class="halo-stat">
            <div class="halo-label">Round</div>
            <div id="roundStat" class="halo-value"></div>
        </div>

        <div class="halo-stat">
            <div class="halo-label">Act</div>
            <div id="actIndicator" class="halo-value"></div>
        </div>

        <div class="halo-stat">
            <div class="halo-label">Leverage</div>
            <div id="leverageStat" class="halo-value"></div>
        </div>

        <div class="halo-stat">
            <div class="halo-label">Plays</div>
            <div id="playsStat" class="halo-value"></div>
        </div>

        <div class="halo-stat">
            <div class="halo-label">Surge</div>
            <div id="surgeStat" class="halo-value"></div>
        </div>

        <div class="halo-stat">
            <div class="halo-label">Pushback</div>
            <div id="pushbackStat" class="halo-value"></div>
        </div>
    </div>

    <!-- RESOURCES -->
    <div id="resources">
        <div class="resource-item resource-political">
            <span class="resource-label">Political</span>
            <span id="politicalStat" class="resource-value">5</span>
            <div class="resource-bar">
                <div class="resource-fill"></div>
            </div>
        </div>
        <div class="resource-item resource-social">
            <span class="resource-label">Social</span>
            <span id="socialStat" class="resource-value">5</span>
            <div class="resource-bar">
                <div class="resource-fill"></div>
            </div>
        </div>
        <div class="resource-item resource-momentum">
            <span class="resource-label">Momentum</span>
            <span id="momentumStat" class="resource-value">0</span>
            <div class="resource-bar">
                <div class="resource-fill"></div>
            </div>
        </div>
        <div class="resource-item resource-infrastructure">
            <span class="resource-label">Infrastructure</span>
            <span id="infrastructureStat" class="resource-value">0</span>
            <div class="resource-bar">
                <div class="resource-fill"></div>
            </div>
        </div>
    </div>

    <!-- TRACK HALOS -->
    <div class="track-row">

        <div id="track-care" class="track-halo">
            <div class="halo-label">Care</div>
            <div class="halo-ring"></div>
            <div class="halo-value"></div>
        </div>

        <div id="track-climate" class="track-halo">
            <div class="halo-label">Climate</div>
            <div class="halo-ring"></div>
            <div class="halo-value"></div>
        </div>

        <div id="track-solidarity" class="track-halo">
            <div class="halo-label">Solidarity</div>
            <div class="halo-ring"></div>
            <div class="halo-value"></div>
        </div>

        <div id="track-authority" class="track-halo">
            <div class="halo-label">Authority</div>
            <div class="halo-ring"></div>
            <div class="halo-value"></div>
        </div>

        <div id="track-capital" class="track-halo">
            <div class="halo-label">Capital</div>
            <div class="halo-ring"></div>
            <div class="halo-value"></div>
        </div>
    </div>
<!-- STRAIN CORE LAYER -->
<div class="strain-layer">
    <div id="track-strain" class="track-halo">
        <div class="halo-label">Strain</div>
        <div class="halo-ring"></div>
        <div class="halo-value"></div>
    </div>
</div>
    <!-- CARD ROW -->
    <div id="hand" class="card-row"></div>

    <!-- CONTROLS -->
    <div id="controls">
        <button id="exportLogBtn">Export Log</button>
        <button id="nextRoundBtn">Next Round</button>
    </div>

</div>

<!-- ================= AUDIO LAYERS ================= -->

<audio id="bgCalm" src="./assets/audio/calm.mp3" preload="auto"></audio>
<audio id="bgTension" src="./assets/audio/tension.mpeg" preload="auto"></audio>
<audio id="bgCollapse" src="./assets/audio/collapse.mp3.mpeg" preload="auto"></audio>
<audio id="sfxLowCapital" src="./assets/audio/lowtension.mp3.mpeg" preload="auto"></audio>

<script type="module" src="main.js?v=6"></script>
<script>
    // Error handling for module loading
    window.addEventListener('error', function(e) {
        console.error('Global error:', e.error);
        const app = document.getElementById('app');
        if (app) {
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = 'position:fixed;top:10px;right:10px;background:#ef4444;color:white;padding:20px;border-radius:8px;z-index:9999;max-width:400px;';
            errorDiv.innerHTML = '<strong>JavaScript Error:</strong><br>' + (e.error?.message || e.message || 'Unknown error');
            app.appendChild(errorDiv);
        }
    });
</script>
</body>
</html>
