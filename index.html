<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>System Shift – Research Build</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
    <canvas id="ambientCanvas"></canvas>
    <div id="systemWarningOverlay"></div>

    <!-- TOP ROW -->
    <div class="top-bar">
        <div class="halo-stat">
            <div class="halo-label">Round</div>
            <div id="roundStat" class="halo-value"></div>
        </div>

        <div class="halo-stat">
            <div class="halo-label">Leverage</div>
            <div id="leverageStat" class="halo-value"></div>
        </div>

        <div class="halo-stat">
            <div class="halo-label">Surge</div>
            <div id="surgeStat" class="halo-value"></div>
        </div>

        <div class="halo-stat">
            <div class="halo-label">Pushback</div>
            <div id="pushbackStat" class="halo-value"></div>
        </div>
    </div>

    <!-- TRACK HALOS -->
    <div class="track-row">

        <div id="track-care" class="track-halo">
            <div class="halo-label">Care</div>
            <div class="halo-ring"></div>
            <div class="halo-value"></div>
        </div>

        <div id="track-climate" class="track-halo">
            <div class="halo-label">Climate</div>
            <div class="halo-ring"></div>
            <div class="halo-value"></div>
        </div>

        <div id="track-solidarity" class="track-halo">
            <div class="halo-label">Solidarity</div>
            <div class="halo-ring"></div>
            <div class="halo-value"></div>
        </div>

        <div id="track-authority" class="track-halo">
            <div class="halo-label">Authority</div>
            <div class="halo-ring"></div>
            <div class="halo-value"></div>
        </div>

        <div id="track-capital" class="track-halo">
            <div class="halo-label">Capital</div>
            <div class="halo-ring"></div>
            <div class="halo-value"></div>
        </div>

        <div id="track-strain" class="track-halo">
            <div class="halo-label">Strain</div>
            <div class="halo-ring"></div>
            <div class="halo-value"></div>
        </div>

    </div>

    <!-- CARD ROW -->
    <div id="hand" class="card-row"></div>

    <!-- CONTROLS -->
    <div id="controls">
        <button id="exportLogBtn">Export Log</button>
        <button id="nextRoundBtn">Next Round</button>
    </div>

</div>

<!-- ================= AUDIO LAYERS ================= -->

<audio id="bgCalm" src="./assets/audio/calm.mp3" preload="auto"></audio>
<audio id="bgTension" src="./assets/audio/tension.mpeg" preload="auto"></audio>
<audio id="bgCollapse" src="./assets/audio/collapse.mp3" preload="auto"></audio>
<audio id="sfxLowCapital" src="./assets/audio/lowtension.mp3" preload="auto"></audio>

<script type="module" src="main.js?v=3"></script>

</body>
</html>
